{% extends "doctor/main.html" %}
{% load hashid_tags %}
{% load static %}
{% block title %}Edit Category{% endblock %}
{% block content %}

<main class="main-content" id="mainContent">
    <!-- Page Header -->
    <div class="page-head">
        <div>
            <h2 class="page-title">Edit Category</h2>
            <p class="page-subtitle">Update your expense category details.</p>
        </div>
        <a href="{% url 'expenses:category_list' %}" class="btn-page btn-page-outline">
            <i class="bi bi-arrow-left"></i> Categories
        </a>
    </div>

    <div class="dc-form-shell">
        <div class="dc-card">
            <div class="dc-card-body">
                <section class="dc-section">
                    <h3 class="dc-section-title"><i class="bi bi-tags"></i> Category details</h3>
                    <form method="post" action="{% url 'expenses:edit_category' category.id %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="dc-label">Category Name <span class="dc-muted">*</span></label>
                            <input type="text" name="name" value="{{ category.name }}" class="form-control" placeholder="e.g. Salary, Utilities" required>
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" id="isActiveSwitch" name="is_active" {% if category.is_active %}checked{% endif %}>
                            <label class="form-check-label ms-2" for="isActiveSwitch">Active Status</label>
                        </div>
                        <div class="dc-form-footer mx-n3 mb-n3">
                            <a href="{% url 'expenses:category_list' %}" class="btn-ghost">Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>

{% endblock %}
