{% extends "doctor/main.html" %}
{% block title %}Add Expense{% endblock %}
{% block content %}
<main class="main-content" id="mainContent">

    <!-- Page Header -->
    <div class="page-head">
        <div>
            <h2 class="page-title">Record Expense</h2>
            <p class="page-subtitle">Fill in the details to record a new clinic expense.</p>
        </div>
        <a href="{% url 'expenses:expense_list' %}" class="action-btn">
            <i class="bi bi-arrow-left"></i> Back to Expenses
        </a>
    </div>

    <div class="dc-form-shell">
        <div class="dc-card">
            <form method="post" action="{% url 'expenses:add_expense' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="dc-card-body">
                    <section class="dc-section">
                        <h3 class="dc-section-title"><i class="bi bi-wallet2"></i> Expense details</h3>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="dc-label">Expense Title <span class="dc-muted">*</span></label>
                                <input type="text" class="form-control" name="title" placeholder="e.g. Electricity Bill, Clinic Supplies" required>
                            </div>
                            <div class="col-md-6">
                                <label class="dc-label">Category <span class="dc-muted">*</span></label>
                                <div class="d-flex gap-2">
                                    <select class="form-select" name="category" required>
                                        <option value="" disabled selected>Select Category</option>
                                        {% for category in categories %}
                                        <option value="{{ category.id }}">{{ category.name }}</option>
                                        {% endfor %}
                                    </select>
                                    <a href="{% url 'expenses:category_list' %}" class="btn-ghost" title="Manage Categories" aria-label="Manage Categories">
                                        <i class="bi bi-gear-fill"></i>
                                    </a>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="dc-label">Amount (₹) <span class="dc-muted">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text">₹</span>
                                    <input type="text" inputmode="decimal" id="amountInput"
                                        class="form-control text-end dc-mono"
                                        name="amount" placeholder="0.00" required
                                        pattern="^\d+(\.\d{1,2})?$">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="dc-label">Expense Date <span class="dc-muted">*</span></label>
                                <input type="date" class="form-control" name="expense_date" required>
                            </div>
                            <div class="col-12">
                                <label class="dc-label">Notes / Description</label>
                                <textarea class="form-control" name="notes" rows="3" placeholder="Add any additional details here..."></textarea>
                            </div>
                            <div class="col-12">
                                <label class="dc-label">Attachment / Invoice Receipt</label>
                                <div class="dc-callout">
                                    <div class="d-flex align-items-center gap-2 mb-2">
                                        <i class="bi bi-cloud-arrow-up fs-4"></i>
                                        <span class="dc-muted">Choose a receipt or invoice file.</span>
                                    </div>
                                    <input type="file" name="attachment" class="form-control">
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="dc-form-footer">
                    <button type="reset" class="btn-ghost">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Save Expense
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>

<script>
    (function () {
        var el = document.getElementById('amountInput');
        if (!el) return;
        // Allow: digits, one decimal point, backspace, delete, arrows, tab, home, end
        el.addEventListener('keydown', function (e) {
            var allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End'];
            if (allowed.includes(e.key)) return;
            if (e.key === '.' && !this.value.includes('.')) return;
            if (/^[0-9]$/.test(e.key)) return;
            e.preventDefault();
        });
        // Block paste of non-numeric
        el.addEventListener('paste', function (e) {
            var pasted = (e.clipboardData || window.clipboardData).getData('text');
            if (!/^\d+(\.\d*)?$/.test(pasted)) e.preventDefault();
        });
    })();
</script>
{% endblock %}
