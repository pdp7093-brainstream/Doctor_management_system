{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>

  <!-- Favicons -->
  {% if clinic and clinic.logo %}
  <link href="{{ clinic.logo.url }}" rel="icon">
  <link href="{{ clinic.logo.url }}" rel="apple-touch-icon">
  {% else %}
  <link href="{% static 'assets/img/ayurveda/hitshree-icon.png' %}" rel="icon">
  <link href="{% static 'assets/img/ayurveda/hitshree-icon.png' %}" rel="apple-touch-icon">
  {% endif %}

  {% block auth_css %}
  <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/bootstrap-icons/bootstrap-icons.css' %}">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
  {% endblock %}
  <link href="{% static 'assets/css/auth.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/sweetalert.css' %}" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{% static 'assets/js/sweetalert-config.js' %}"></script>
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>

</html>
