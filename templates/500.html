{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 – Server Error</title>
    <link href="{% static 'assets/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'assets/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F3F8F2;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #14281A;
            padding: 24px;
        }
        .error-card {
            background: #fff;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            border-radius: 16px;
            border: 1px solid #DCEBDC;
            box-shadow: 0 8px 24px rgba(1, 83, 21, 0.06);
            text-align: center;
        }
        .clinic-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 12px;
        }
        .clinic-name {
            font-size: 14px;
            color: #5B6B5E;
            margin-bottom: 24px;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #015315;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 12px;
        }
        .accent-bar {
            width: 40px;
            height: 3px;
            background: #FD6801;
            border-radius: 3px;
            margin: 0 auto 20px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #14281A;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 15px;
            color: #5B6B5E;
            line-height: 1.6;
            max-width: 360px;
            margin: 0 auto 28px;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex: 1 1 0;
            min-width: 160px;
            height: 42px;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        @media (max-width: 420px) {
            .btn {
                flex: 1 1 100%;
                min-width: 0;
            }
        }
        .btn-primary {
            background: #015315;
            color: #fff;
        }
        .btn-primary:hover {
            background: #013A0F;
            color: #fff;
        }
        .btn-secondary {
            background: #fff;
            color: #015315;
            border: 1px solid #CFE5CF;
        }
        .btn-secondary:hover {
            background: #EAF4EA;
            color: #015315;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <img src="{% static 'assets/img/ayurveda/hitshree-icon.png' %}" alt="Hitshree Ayurveda" class="clinic-logo">
        <div class="clinic-name">Hitshree Ayurveda</div>

        <div class="error-code">500</div>
        <div class="accent-bar"></div>

        <h1 class="error-title">Something went wrong</h1>
        <p class="error-message">We&rsquo;re having a temporary problem. Please try again in a few minutes.</p>

        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house-door"></i> Go to Homepage
            </a>
            <button type="button" class="btn btn-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left"></i> Go Back
            </button>
        </div>
    </div>
</body>
</html>
