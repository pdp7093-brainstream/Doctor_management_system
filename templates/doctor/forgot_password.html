{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/bootstrap-icons/font/bootstrap-icons.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100" style="background-color: #f8f9fa;">
    <div class="card shadow-lg rounded-4" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold">Forgot Password</h3>
                <p class="text-muted">Enter your username and OTP to reset your password.</p>
            </div>

            {% if error %}
                <div class="alert alert-danger small">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="alert alert-success small">{{ success }}</div>
            {% endif %}

            <form method="POST" action="" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ username|default:'' }}" required>
                </div>

                {% if show_otp_form %}
                    <div class="mb-3">
                        <label class="form-label">OTP</label>
                        <input type="text" name="otp" class="form-control" placeholder="Enter OTP" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100">
                    {% if show_otp_form %}Reset Password{% else %}Send OTP{% endif %}
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'doctor:login' %}" class="text-decoration-none">Back to login</a>
            </div>
        </div>
    </div>
    <script src="{% static 'assets/js/bootstrap.min.js' %}"></script>
</body>
</html>
